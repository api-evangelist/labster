aid: labster
name: Labster
description: Labster is a virtual laboratory simulation platform for universities, colleges and high schools,
  delivering more than 300 immersive 3D science simulations across Biology, Chemistry, Physics and Health
  Sciences. Students run experiments in a browser without physical lab infrastructure or safety risk, with
  automated grading, unlimited practice attempts, interactive 3D chemistry models and customizable quizzes.
  Labster reaches students through the institution's learning management system as a 1EdTech LTI 1.3 tool,
  with configuration guides for Canvas, Blackboard, Moodle, D2L Brightspace, Sakai and Schoology, plus Clever
  SSO for districts. Labster publishes no public developer API, no OpenAPI description and no developer portal
  - its machine-to-machine surface is the per-tenant LTI 1.3 tool registration issued by Labster Customer
  Success. The company is SOC 2 Type 2 and TX-RAMP Level 2 certified, publishes HECVAT Full and a VPAT through
  its Trust Center, and operates a responsible disclosure program at security@labster.com.
